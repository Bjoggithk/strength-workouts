<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17221f">
  <meta name="description" content="A mobile-first strength companion for runners. Follow gym and home sessions, track sets and learn each movement.">
  <title>Strength Workouts — Runner's Gym</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="brand-home" type="button" aria-label="Stride Strength home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-copy"><strong>STRENGTH WORKOUTS</strong><small>RUNNER'S GYM</small></span>
      </button>
      <button class="settings-trigger" id="settings-trigger" type="button" aria-expanded="false">
        <span aria-hidden="true">⚙</span><span>Settings</span>
      </button>
    </header>
    <section id="settings-panel" class="settings-panel" hidden></section>
    <main id="app" tabindex="-1" aria-live="polite">
      <div class="loading-state"><span class="loading-dot"></span> Loading your training plan…</div>
    </main>
    <footer class="site-footer">
      <span>BUILT FOR THE LONG RUN</span>
      <span>Progress stays on this device</span>
    </footer>
  </div>
  <noscript><div class="noscript">This workout app needs JavaScript enabled to track sets and move between exercises.</div></noscript>
</body>
</html>
